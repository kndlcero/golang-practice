<!DOCTYPE html>
<html>
<head>
    <title>Uploaded Files</title>
    <link rel="stylesheet" type="text/css" href="/static/index.css">
</head>
<body>
    <nav>
        <a href="/upload">Upload File</a>
        <a href="/logout">Logout</a>
    </nav>
    <main>
        <h1>All Uploaded Files</h1>

        {{ if .Uploads }}
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Course</th>
                    <th>College</th>
                    <th>Uploaded By</th>
                    <th>Download</th>
                </tr>
            </thead>
            <tbody>
                {{ range .Uploads }}
                <tr>
                    <td>{{ .Title }}</td>
                    <td>{{ .Description }}</td>
                    <td>{{ .Course }}</td>
                    <td>{{ .College }}</td>
                    <td>{{ .UploadedBy }}</td>
                    <td><a href="{{ .FileURL }}" target="_blank" download>Download</a></td>
                </tr>
                {{ end }}
            </tbody>
        </table>
        {{ else }}
        <p>No files uploaded yet.</p>
        {{ end }}
    </main>
</body>
</html>
